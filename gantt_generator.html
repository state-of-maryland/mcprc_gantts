    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load Plotly.js CDN for client-side charting -->

    <style>
        /* Set the Inter font */
        body { font-family: 'Inter', sans-serif; }
        /* Ensure the chart container takes up necessary space */
        #chart-container { min-height: 600px; }
        /* Style for the loading state */
        .loader {
            border: 6px solid #f3f3f3;
            border-top: 6px solid #10b981; /* Tailwind emerald-500 */
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>

        // --- Dropdown Population ---
        function populateDropdown() {
            // Get unique project IDs
            const projectIDs = [...new Set(fullGanttData.map(d => d['Project ID']))].sort();
            
            // Clear existing options
            selector.innerHTML = '';
            
            // 1. Add 'Show All' option
            let allOption = document.createElement('option');
            allOption.value = 'ALL_PROJECTS';
            allOption.textContent = '➡️ Show All Projects';
            selector.appendChild(allOption);

            // 2. Add individual project options
            projectIDs.forEach(id => {
                let option = document.createElement('option');
                option.value = id;
                option.textContent = id;
                selector.appendChild(option);
            });

            // Add event listener to handle filtering on change
            selector.addEventListener('change', (event) => {
                filterAndPlot(event.target.value);
            });
        }

        // --- Plotting and Filtering Logic ---

        function filterAndPlot(projectId) {
            chartDiv.innerHTML = `<div class="loader mx-auto"></div>`; // Show loader

            let filteredData = fullGanttData;
            if (projectId !== 'ALL_PROJECTS') {
                filteredData = fullGanttData.filter(d => d['Project ID'] === projectId);
            }
            
            // 1. Prepare Traces (Data structure for Plotly.js Gantt chart)
            // Plotly.js requires Gantt data to be structured by color group (Activity)
            
            // Get unique activities for coloring
            const uniqueActivities = [...new Set(filteredData.map(d => d['Activity']))];
            
            // Get unique permits for y-axis ordering
            const uniquePermits = [...new Set(filteredData.map(d => d['Permit ID']))]
                                .sort((a, b) => a.localeCompare(b)).reverse(); // Reverse for typical Gantt order

            let dataTraces = [];
            
            uniqueActivities.forEach(activity => {
                const activityData = filteredData.filter(d => d['Activity'] === activity);

                if (activityData.length > 0) {
                    // Collect arrays for x_start, x_end, and y (Permit IDs)
                    const xStart = activityData.map(d => d.Start);
                    const xEnd = activityData.map(d => d.Finish);
                    const y = activityData.map(d => d['Permit ID']);
                    
                    // Create hover text
                    const text = activityData.map(d => 
                        `${d['Permit ID']} (${d['Project ID']})<br>
                         ${d.Activity}: ${d['Duration (Days)']} days`
                    );

                    dataTraces.push({
                        type: 'bar', 
                        orientation: 'h',
                        x: activityData.map(d => new Date(d.Finish) - new Date(d.Start)), // Duration in ms
                        base: activityData.map(d => new Date(d.Start)), // Start date for base
                        y: y,
                        name: activity,
                        customdata: activityData.map(d => ({ 
                            start: d.Start, 
                            finish: d.Finish, 
                            days: d['Duration (Days)'],
                            project: d['Project ID']
                        })),
                        hovertemplate: '<b>Permit ID:</b> %{y}<br>' +
                                       '<b>Activity:</b> ' + activity + '<br>' +
                                       '<b>Start:</b> %{customdata.start}<br>' +
                                       '<b>Finish:</b> %{customdata.finish}<br>' +
                                       '<b>Duration:</b> %{customdata.days} days<extra></extra>',
                        marker: {
                            color: getColorForActivity(activity), // Use a fixed color
                        }
                    });
                }
            });

            // 2. Define Layout
            const layout = {
                title: `Permit Processing Timeline: ${projectId === 'ALL_PROJECTS' ? 'All Projects' : projectId}`,

                        buttons: [
                            { count: 1, label: '1m', step: 'month', stepmode: 'backward' },
                            { count: 6, label: '6m', step: 'month', stepmode: 'backward' },
                            { step: 'all', label: 'All' }
                        ]
                    },
                    rangeslider: { visible: true },
                },
                yaxis: {
                    autorange: 'reversed',
                    title: 'Permit ID',
                    categoryorder: 'array',
                    categoryarray: uniquePermits, // Set the filtered category array
                },
                barmode: 'stack', // Stack segments horizontally
                margin: { l: 150, r: 50, t: 100, b: 80 }
            };

            // 3. Plot the chart
            Plotly.newPlot(chartDiv, dataTraces, layout, {responsive: true});
        }

        // Simple color mapping function for activities (as Plotly Express does this automatically)
        function getColorForActivity(activity) {
            const colors = {
                'Initial Submission': '#10b981', // Emerald
                'Internal Comms Wait': '#3b82f6', // Blue
                'Assessment Phase': '#f97316', // Orange
                'Formal Review Period': '#ef4444', // Red
                'Final Approval/Buffer': '#8b5cf6' // Violet
            };
            return colors[activity] || '#6b7280'; // Default gray
        }

        // Start the application
        window.onload = loadAndInitialize;
    </script>
</body>
</html>
